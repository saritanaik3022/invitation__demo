<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#977B45"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B26871"/>
      <stop offset="100%" stop-color="#803B44"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="70%" stop-color="#FBF4F2"/>
      <stop offset="100%" stop-color="#F2DFE2"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9E5A61" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circular medallion -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#softShadow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3" opacity="0.8"/>

  <!-- Floral decorative leaves top and bottom -->
  <g fill="#697358" opacity="0.85">
    <!-- Top wreath motif -->
    <path d="M64 12 C62 16 60 18 56 19 C61 20 63 22 64 25 C65 22 67 20 72 19 C68 18 66 16 64 12 Z"/>
    <circle cx="49" cy="22" r="2.2"/>
    <circle cx="79" cy="22" r="2.2"/>
    
    <!-- Bottom wreath motif -->
    <path d="M64 116 C62 112 60 110 56 109 C61 108 63 106 64 103 C65 106 67 108 72 109 C68 110 66 112 64 116 Z"/>
    <circle cx="49" cy="106" r="2.2"/>
    <circle cx="79" cy="106" r="2.2"/>
  </g>

  <!-- Small intertwined wedding rings at center top -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.9">
    <circle cx="60" cy="36" r="5.5"/>
    <circle cx="68" cy="36" r="5.5"/>
  </g>

  <!-- Intertwined monogram initials A & R -->
  <text x="64" y="74" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Georgia', 'Lora', serif" 
        font-size="34" 
        font-weight="700" 
        font-style="italic" 
        letter-spacing="-1"
        fill="url(#roseGrad)">
    A<tspan font-size="20" font-weight="400" dy="-4" fill="#C59B27">&amp;</tspan><tspan dy="4">R</tspan>
  </text>

  <!-- Subtle subtext date / forever indicator -->
  <text x="64" y="93" 
        text-anchor="middle" 
        font-family="'Lora', 'Georgia', serif" 
        font-size="8.5" 
        font-weight="600" 
        letter-spacing="2"
        fill="#697358">
    29·10·26
  </text>
</svg>
